[package]
name = "wavepill"
version = "0.1.0"
edition = "2024"
description = "Wayland dynamic audio visualizer pill for Hyprland"

[lib]
name = "wavepill"
path = "src/lib.rs"

[[bin]]
name = "wavepill"
path = "src/main.rs"

[dependencies]
dirs = "7"
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.9", features = ["v1_3"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
